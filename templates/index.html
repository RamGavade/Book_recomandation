<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommendation</title>
    <link rel="stylesheet" href="../static/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css"
    />
</head>
<body style="background-color: black">
<nav class="navbar" style="background-color: aquamarine">
    <p class="navbar-brand">My Book Recommender System</p>
    <ul class="nav navbar-nav">
       <li> <a href="/">Home</a></li>
        <li> <a href="/recommend">Recommend</a></li>
        <li><a href="/about">About</a></li>
    </ul>
</nav>
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h1 style="color: aliceblue">Top 50 Book</h1>
        </div>

        {% for i in range(book_name|length) %}
        <div class="col-md-3" style="margin-top: 30px">
            <div class="card">
                <div class="card-boby">
                    <img class="card-img-top" src="{{ image[i] }}">
                    <p style="font-size: 13px ; color: aliceblue">{{ book_name[i] }}</p>
                    <p style="font-size: 11px; color: aliceblue">{{ author[i] }}</p>
                    <p style="font-size: 10px; color: aliceblue"> Votes - {{ votes[i] }}</p>
                    <p style="font-size: 10px; color: aliceblue"> Rating - {{ rating[i] }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% include "footer.html" %}
